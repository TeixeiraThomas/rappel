# Intégration continue : tests unitaires + tests de bout en bout (Chromium) sur chaque PR et push.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Construit l'app (+ build « GitHub Pages ») et lance toute la suite e2e
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapport-e2e
          path: test-results/
          retention-days: 7
